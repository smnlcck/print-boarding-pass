<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boarding Pass Printer</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600&display=swap">
<style>
:root{
  --page:#dcdcdc;
  --screen:#f5f5f5;
  --ink:#3C3C3B;
  --ink-strong:#1D1D1B;
  --ink-soft:#63666A;
  --teal:#006272;
  --deep-teal:#083D4B;
  --shamrock:#84BD00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:'Mukta','Segoe UI',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}

/* stage: phone scaled to fit the viewport */
.stage{position:relative;width:calc(390px * var(--s,1) + 24px * var(--s,1));height:calc(844px * var(--s,1) + 24px * var(--s,1))}
.device{position:absolute;left:0;top:0;width:414px;height:868px;transform-origin:0 0;transform:scale(var(--s,1));padding:12px;border-radius:58px;background:#1d1d1f;box-shadow:0 0 0 1px #3a3a3c inset,0 30px 60px rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.14)}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--screen)}

.controls{margin-top:18px;display:flex;gap:10px}
.controls button{font:500 14px/1 'Mukta',system-ui,sans-serif;height:40px;padding:0 18px;border-radius:20px;border:1px solid rgba(0,0,0,.14);background:#fff;color:var(--ink-strong);cursor:pointer}
.controls button:hover{background:#f2f2f2}
.controls button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* record mode: bare screen only */
body.record{background:var(--screen)}
body.record .controls{display:none}
body.record .stage{width:390px;height:844px}
body.record .device{transform:none;padding:0;border-radius:0;background:none;box-shadow:none;width:390px;height:844px}
body.record .screen{border-radius:0}

/* header */
.header{position:absolute;left:0;top:0;width:390px;padding:20px 16px 0;display:flex;align-items:center;justify-content:space-between;z-index:4}
.icon-btn{width:48px;height:48px;border-radius:24px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.title{display:flex;flex-direction:column;align-items:center}
.title b{font-size:18px;font-weight:600;color:var(--deep-teal);line-height:24px}
.title span{font-size:14px;color:#4F5B5E;line-height:18px}
.status{position:absolute;left:0;top:76px;width:390px;text-align:center;font-size:14px;line-height:18px;color:var(--teal);font-weight:500;z-index:4}

/* printer */
.printer{position:absolute;left:14px;top:102px;width:362px;height:56px;border-radius:18px;background:linear-gradient(180deg,#9A9C9F 0%,#808285 55%,#6E7073 100%);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -2px 0 rgba(0,0,0,.18) inset,0 12px 24px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.16);z-index:3}
.slot{position:absolute;left:9px;top:34px;width:344px;height:9px;border-radius:5px;background:#2A2B2D;box-shadow:0 1px 0 rgba(255,255,255,.12),0 2px 3px rgba(0,0,0,.6) inset}
.led{position:absolute;right:16px;top:11px;width:8px;height:8px;border-radius:50%;background:#5E6063;box-shadow:inset 0 1px 1px rgba(0,0,0,.4);transition:background .3s,box-shadow .3s}
.led.on{background:var(--shamrock);box-shadow:0 0 0 3px rgba(132,189,0,.18),0 0 10px rgba(132,189,0,.8)}
.led.blink{animation:blink .5s ease-in-out infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.35}}

/* feed */
.feed{position:absolute;left:23px;top:142px;width:344px;height:702px;overflow:hidden;z-index:2}
.feed-shade{position:absolute;left:0;top:0;width:344px;height:30px;background:linear-gradient(180deg,rgba(30,30,32,.28),rgba(30,30,32,0));z-index:2;pointer-events:none}
.tearwrap{transform-origin:85% 0}
.tearwrap.is-printed{animation:settle .55s cubic-bezier(.3,1.4,.5,1) forwards}
.pass{filter:drop-shadow(0 1px 1px rgba(0,0,0,.08)) drop-shadow(0 10px 18px rgba(0,0,0,.13));transform:translate3d(0,-101%,0)}
.pass.is-printing{animation:printFeed 3200ms linear both}
.pass.is-printed{transform:translate3d(0,0,0)}
.paper{width:343px}
.paper.is-printing{animation:buzz .07s steps(2) infinite}
@keyframes printFeed{
  0%  {transform:translate3d(0,-101%,0);animation-timing-function:cubic-bezier(.35,0,.45,1)}
  11% {transform:translate3d(0,-89%,0)}
  14% {transform:translate3d(0,-88.6%,0);animation-timing-function:cubic-bezier(.35,0,.45,1)}
  31% {transform:translate3d(0,-67%,0)}
  34% {transform:translate3d(0,-66.6%,0);animation-timing-function:cubic-bezier(.35,0,.45,1)}
  52% {transform:translate3d(0,-44%,0)}
  55% {transform:translate3d(0,-43.6%,0);animation-timing-function:cubic-bezier(.35,0,.45,1)}
  74% {transform:translate3d(0,-20%,0)}
  77% {transform:translate3d(0,-19.6%,0);animation-timing-function:cubic-bezier(.25,0,.2,1)}
  100%{transform:translate3d(0,0,0)}
}
@keyframes buzz{0%{transform:translateX(-.35px)}100%{transform:translateX(.35px)}}
@keyframes settle{0%{transform:translate3d(0,0,0) rotate(0)}45%{transform:translate3d(0,7px,0) rotate(.5deg)}100%{transform:translate3d(0,4px,0) rotate(.3deg)}}

/* pass content */
.edge-bottom{height:12px;background:radial-gradient(circle at 9px 12px,transparent 6.5px,#fff 7px) 0 0/18px 12px repeat-x}
.edge-top{height:12px;background:radial-gradient(circle at 9px 0,transparent 6.5px,#fff 7px) 0 0/18px 12px repeat-x}
.notch{height:14px;position:relative;background:radial-gradient(circle at 0 50%,transparent 7px,#fff 7.5px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 7px,#fff 7.5px) right/50% 100% no-repeat}
.notch::after{content:"";position:absolute;left:12px;right:12px;top:6.5px;border-top:1px dashed #D0D0CE}
.sec{background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.col{display:flex;flex-direction:column}
.col.r{align-items:flex-end}
.lbl{font-size:12px;line-height:21px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.val{font-size:17px;line-height:21px;color:var(--ink-soft)}
.small{font-size:13px;line-height:21px;color:var(--ink)}
.code{font-size:34px;line-height:36px;font-weight:300;color:var(--ink-strong);letter-spacing:-.01em}
.group{border:1px solid var(--ink-soft);padding:4px 8px;font-size:16px;line-height:20px;font-weight:600;letter-spacing:.02em;color:var(--ink)}


/* footer */
.footer{position:absolute;left:0;bottom:0;width:390px;padding:40px 20px 28px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(245,245,245,0) 0%,var(--screen) 42%);z-index:4}
.wallet{height:48px;padding:0 22px;border-radius:24px;border:0;background:#000;color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit}
.wallet span{display:flex;flex-direction:column;align-items:flex-start}

@media (prefers-reduced-motion: reduce){
  .pass.is-printing{animation-duration:.01s}
  .paper.is-printing,.led.blink{animation:none}
}
</style>
</head>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.has('record')) document.body.classList.add('record');

  // Scale the phone to fit the viewport
  function fit(){
    if (document.body.classList.contains('record')) return;
    var s = Math.min(1, (innerHeight - 96) / 868, (innerWidth - 32) / 414);
    document.documentElement.style.setProperty('--s', Math.max(.4, s).toFixed(3));
  }
  addEventListener('resize', fit); fit();

  var PRINT = 3200, START = 700;
  var pass = document.getElementById('pass'), paper = document.getElementById('paper'),
      wrap = document.getElementById('tearwrap'), led = document.getElementById('led'),
      status = document.getElementById('status');
  var phase = 'empty', timers = [];

  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clear(){ timers.forEach(clearTimeout); timers = []; }

  function set(p){
    phase = p;
    pass.className = 'pass' + (p === 'printing' ? ' is-printing' : (p === 'empty' ? '' : ' is-printed'));
    paper.className = 'paper' + (p === 'printing' ? ' is-printing' : '');
    wrap.className = 'tearwrap' + (p === 'printed' ? ' is-printed' : '');
    led.className = 'led' + (p === 'printing' ? ' on blink' : (p === 'printed' ? ' on' : ''));
    status.textContent = {
      empty: 'Getting your boarding pass ready…',
      printing: 'Printing your boarding pass…',
      printed: 'All set. Have a great flight'
    }[p];
    void pass.offsetWidth;
  }

  function print(){
    clear(); set('empty'); set('printing');
    later(function(){ set('printed'); }, PRINT + 40);
  }

  document.getElementById('reprint').addEventListener('click', function(){
    if (phase !== 'printing') print();
  });
  document.getElementById('restart').addEventListener('click', function(){ clear(); set('empty'); later(print, 300); });

  // Deterministic seek for frame-accurate video export (?record=1&seek=1)
  if (params.has('seek')) {
    var P = PRINT + 40, HOLD = 3000;
    var cycle = [['empty',-1000,0],['printing',0,P],['printed',P,P+HOLD]];
    window.__cycleMs = P + HOLD;
    window.__seek = function(t){
      var seg = cycle.filter(function(c){ return t >= c[1] && t < c[2]; })[0] || cycle[2];
      if (phase !== seg[0]) {
        document.getAnimations().forEach(function(a){ a.cancel(); });
        set(seg[0]); void document.body.offsetWidth;
      }
      document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = Math.max(0, t - seg[1]); });
    };
    return;
  }

  later(print, START);
})();
</script>
